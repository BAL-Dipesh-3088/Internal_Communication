services:
  postgres:
    image: postgres:16-alpine
    container_name: connecthub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: connecthub
      POSTGRES_USER: connecthub
      POSTGRES_PASSWORD: connecthub_prod_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connecthub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: connecthub-redis
    restart: unless-stopped
    command: redis-server --requirepass connecthub_redis_prod_2026
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "connecthub_redis_prod_2026", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  stalwart:
    image: stalwartlabs/stalwart:latest
    container_name: connecthub-mail
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "25:25"
      - "587:587"
      - "143:143"
      - "993:993"
      - "4190:4190"
    volumes:
      - stalwart_data:/opt/stalwart
    healthcheck:
      disable: true

  # LiveKit WebRTC SFU — handles all group call media routing
  # https://docs.livekit.io/home/self-hosting/local/
  livekit:
    image: livekit/livekit-server:latest
    container_name: connecthub-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "7880:7880"                # WebSocket signaling
      - "7881:7881"                # TCP RTC fallback
      - "3478:3478/udp"            # Built-in TURN relay
      - "50000-50100:50000-50100/udp"  # RTC media (UDP)
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  # Self-hosted speech-to-text (CPU) — OpenAI-compatible /v1/audio/transcriptions.
  # Used by the meeting-notes pipeline to transcribe egress recordings.
  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: connecthub-whisper
    restart: unless-stopped
    environment:
      # Preload the base model so the first transcription isn't a cold download.
      WHISPER__MODEL: Systran/faster-whisper-base
      WHISPER__INFERENCE_DEVICE: cpu
    volumes:
      - whisper_cache:/root/.cache/huggingface

  # LiveKit Egress — records meeting audio (opt-in) to the shared volume, then
  # fires the egress_ended webhook the app listens for. Talks to livekit via redis.
  egress:
    image: livekit/egress:latest
    container_name: connecthub-egress
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    # Chrome (used by the compositor) needs SYS_ADMIN for its sandbox.
    cap_add:
      - SYS_ADMIN
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
      - egress_output:/egress-out

  app:
    build: .
    image: bal-connect-app
    container_name: connecthub-app
    restart: unless-stopped
    env_file:
      - ./server/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
      whisper:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: connecthub
      DB_USER: connecthub
      DB_PASSWORD: connecthub_prod_2026
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: connecthub_redis_prod_2026
      # Stalwart SMTP (primary — all outbound)
      STALWART_SMTP_HOST: stalwart
      STALWART_SMTP_PORT: 587
      STALWART_SMTP_USER: admin
      STALWART_SMTP_PASSWORD: kluwZPlOPr
      STALWART_SMTP_SECURE: "false"
      STALWART_DOMAIN: balasorealloys.in
      # IMAP (Stalwart inbox reading)
      IMAP_HOST: stalwart
      IMAP_PORT: 143
      IMAP_USER: admin
      IMAP_PASSWORD: kluwZPlOPr
      IMAP_SECURE: "false"
      # JWT
      JWT_SECRET: bal_connect_jwt_secret_production_2026_xK9mP2
      JWT_REFRESH_SECRET: bal_connect_refresh_secret_production_2026_yL8nQ3
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      # Uploads
      MAX_FILE_SIZE: 104857600
      AVATAR_DIR: ../data/avatars
      UPLOAD_DIR: ../data/files
      # Client
      CLIENT_URL: http://192.168.10.15
      # Public canonical URL used in ALL outbound emails (meeting invites etc.).
      # Must be the HTTPS address real recipients reach — never an internal IP/localhost.
      PUBLIC_APP_URL: https://icp.balasorealloys.in
      # Email from
      SMTP_FROM_NAME: BAL Connect
      # LiveKit (group calls SFU)
      LIVEKIT_API_KEY: devkey_local
      LIVEKIT_API_SECRET: devsecret_local_at_least_32_characters_long_xx
      # WS URL the BROWSER will use to connect to LiveKit (must be reachable from LAN)
      LIVEKIT_WS_URL: ws://192.168.10.15:7880
      # HTTP URL used by the backend container (internal Docker network)
      LIVEKIT_HTTP_URL: http://livekit:7880
      # ── AI (Smart Compose / Translate / Meeting Notes) ──
      BAL_AI_BASE_URL: https://chat.balasorealloys.in/v1
      BAL_AI_MODEL: qwen3-32b
      # BAL_AI_KEY is supplied via server/.env (env_file) — never inline in git.
      # ── Meeting transcription (self-hosted faster-whisper + LiveKit egress) ──
      WHISPER_URL: http://whisper:8000
      WHISPER_MODEL: Systran/faster-whisper-base
      EGRESS_OUTPUT_DIR: /egress-out
    volumes:
      - app_data:/app/data
      # Read access to the meeting recordings that egress writes.
      - egress_output:/egress-out:ro

  nginx:
    image: nginx:1.24-alpine
    container_name: connecthub-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
    external: true
    name: bal-connect_postgres_data
  redis_data:
    external: true
    name: bal-connect_redis_data
  stalwart_data:
    external: true
    name: bal-connect_stalwart_data
  app_data:
    external: true
    name: bal-connect_app_data
  # Meeting recordings written by egress, read by app. Auto-created (not external).
  egress_output:
  whisper_cache:
